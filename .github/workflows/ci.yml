name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed wheel CLI
        run: |
          python -m venv /tmp/fnirs-flow-wheel
          /tmp/fnirs-flow-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/fnirs-flow-wheel/bin/fnirs-flow --help

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
