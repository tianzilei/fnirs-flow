[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnirs-flow"
version = "1.3.0"
description = "GUI-enabled fNIRS toolbox + reproducibility framework with Flow-based orchestration"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.18,<5.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
    "httpx2>=2.0,<3.0",
    # The API eagerly loads the execution and analysis contracts at startup.
    "numpy>=1.24,<2.0; python_version < '3.13'",
    "numpy>=2.1,<3.0; python_version >= '3.13'",
]
webui = [
    "fnirs-flow[api]",
]
mne = [
    # MNE 1.12 is the last release line supporting Python 3.10; the
    # development branch after v1.12.0 requires Python 3.11 or newer.
    "mne>=1.6,<1.13; python_version < '3.11'",
    "mne>=1.6,<2.0; python_version >= '3.11'",
    "mne-nirs>=0.7,<1.0",
    "mne-bids>=0.15,<1.0",
    "numpy>=1.24,<2.0; python_version < '3.13'",
    "numpy>=2.1,<3.0; python_version >= '3.13'",
]
ml-motion = [
    "numpy>=1.24,<2.0; python_version < '3.13'",
    "numpy>=2.1,<3.0; python_version >= '3.13'",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "PyWavelets>=1.4,<2.0",
]
scientific = [
    "networkx>=3.0,<4.0",
    "statsmodels>=0.14,<1.0",
]
processed-hb = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
]
deep-learning = [
    "torch>=2.2,<3.0",
]
cedalion = [
    "cedalion @ git+https://github.com/ibs-lab/cedalion.git@4eebc94018d1a59d5f112f0be05a3f520431499b",
]
dev = [
    "setuptools>=83.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=4.0,<8.0",
    "mypy>=1.8,<2.0",
    "ruff>=0.12,<1.0",
    "pip-audit>=2.7,<3.0",
    "pip-licenses>=5.0,<6.0",
    "fnirs-flow[full]",
]
full = [
    "fnirs-flow[api,mne,ml-motion,processed-hb,scientific]",
]

[project.scripts]
fnirs-flow = "fnirs_flow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["error"]
markers = [
    "core: marks tests as core (no MNE/Cedalion required)",
    "full: marks tests as full (requires MNE)",
    "cedalion: marks tests as cedalion (requires Cedalion)",
    "adapter: marks tests as adapter (requires MNE or Cedalion)",
    "real_data: marks tests that use real local datasets",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/extract_*.py" = ["E501"]
"scripts/build_*.py" = ["E501"]
"scripts/upgrade_schema_*.py" = ["E501"]
"outputs/**/*.py" = ["E501"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fnirs_flow"]

[tool.hatch.build.targets.sdist]
include = [
    "/fnirs_flow",
    "/tests/package_blackbox.py",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

# Scientific backends are optional runtime integrations and most do not ship
# PEP 561 metadata. Keep project code type-checked while treating those
# external modules as dynamically typed adapter boundaries.
[[tool.mypy.overrides]]
module = [
    "cedalion.*",
    "jsonschema.*",
    "mne.*",
    "mne_bids.*",
    "mne_nirs.*",
    "networkx.*",
    "pandas.*",
    "pywt.*",
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "torch.*",
    "xarray.*",
]
ignore_missing_imports = true
