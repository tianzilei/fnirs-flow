[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnirs-flow"
version = "1.0.2"
description = "GUI-enabled fNIRS toolbox + reproducibility framework with Flow-based orchestration"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]
webui = [
    "fnirs-flow[api]",
]
mne = [
    "mne>=1.6",
    "mne-nirs>=0.7",
    "mne-bids>=0.15",
    "numpy>=1.24",
]
ml-motion = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyWavelets>=1.4",
]
dev = [
    "pytest>=7.0",
    "httpx2>=2.0.0",
    "fnirs-flow[api,mne,ml-motion]",
]
full = [
    "fnirs-flow[api,mne,ml-motion]",
]

[project.scripts]
fnirs-flow = "cli:main"

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"configs" = "configs"
"schemas" = "schemas"
"webui" = "webui"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
