name: fnirs-flow
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.14
  - mne>=1.6,<2.0
  - mne-nirs>=0.7,<1.0
  - scipy>=1.10,<2.0
  # Python 3.13 support starts with NumPy 2.1. The lower bound also gives
  # one reproducible environment across the declared Python 3.11-3.13 range.
  - numpy>=2.1,<3.0
  - pydantic>=2.0,<3.0
  - pip:
    - fnirs-flow[api,mne,ml-motion]
    - networkx>=3.0,<4.0
    - statsmodels>=0.14,<1.0
    - ruff
    - pytest
    - pytest-cov
