[mypy]
python_version = 3.10
files =
    fnirs_flow/adapters/backend_registry.py,
    fnirs_flow/adapters/cedalion_adapter.py,
    fnirs_flow/adapters/cedalion_capabilities.py,
    fnirs_flow/adapters/cedalion_io.py,
    fnirs_flow/adapters/cedalion_steps.py
warn_return_any = True
warn_unused_configs = True
show_error_codes = True

[mypy-cedalion.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-xarray.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-pint.*]
follow_imports = skip
ignore_missing_imports = True
