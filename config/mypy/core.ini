[mypy]
python_version = 3.10
files = fnirs_flow
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
exclude = (?x)(
    ^fnirs_flow/adapters/(mne_nirs_.*|cedalion_.*|qc_metrics\.py|roi_mapping\.py)$
    |^fnirs_flow/data/discovery\.py$
    |^fnirs_flow/exporters/(outputs|reproducibility)\.py$
    )

[mypy-mne.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-mne_nirs.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-mne_bids.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-cedalion.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-scipy.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-sklearn.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-pywt.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-jsonschema.*]
follow_imports = skip
ignore_missing_imports = True
