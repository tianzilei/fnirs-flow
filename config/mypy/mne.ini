[mypy]
python_version = 3.10
files =
    fnirs_flow/adapters/mne_nirs_adapter.py,
    fnirs_flow/adapters/mne_nirs_io.py,
    fnirs_flow/adapters/mne_nirs_steps.py,
    fnirs_flow/adapters/qc_metrics.py,
    fnirs_flow/adapters/roi_mapping.py,
    fnirs_flow/data/discovery.py,
    fnirs_flow/execution/service.py,
    fnirs_flow/exporters/outputs.py,
    fnirs_flow/exporters/reproducibility.py
warn_return_any = True
warn_unused_configs = True
show_error_codes = True

[mypy-mne.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-mne_nirs.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-mne_bids.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-scipy.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-sklearn.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-pywt.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-jsonschema.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-pandas.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-statsmodels.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-networkx.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-torch.*]
follow_imports = skip
ignore_missing_imports = True
